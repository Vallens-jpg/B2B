<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staplr - Ajukan Permintaan</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ==========================================================================
       Ajukan Permintaan Specific Styles
       ========================================================================== */
    .ajukan-body {
      background-color: var(--bg-dashboard);
      min-height: 100vh;
      padding-bottom: 6rem;
    }

    .form-container-center {
      max-width: 780px;
      margin: 2.5rem auto 0 auto;
      padding: 0 1.5rem;
    }

    .ajukan-card {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .ajukan-card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 1.75rem;
      letter-spacing: -0.01em;
    }

    .field-label-sm {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .input-readonly {
      width: 100%;
      padding: 0.85rem 1rem;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.925rem;
      color: #334155;
      font-weight: 500;
    }

    .section-divider {
      height: 1px;
      background-color: #f1f5f9;
      margin: 2rem 0;
    }

    .item-pesanan-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 1rem;
    }

    .table-headers-grid {
      display: grid;
      grid-template-columns: 2fr 110px 140px 110px 40px;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
    }

    .item-row-grid {
      display: grid;
      grid-template-columns: 2fr 110px 140px 110px 40px;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .select-wrapper {
      position: relative;
    }

    .form-select {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #1e293b;
      appearance: none;
      cursor: pointer;
      font-weight: 500;
    }

    .select-arrow {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      pointer-events: none;
      stroke: #64748b;
    }

    .form-input-qty, .form-input-price {
      width: 100%;
      padding: 0.8rem 1rem;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.9rem;
      color: #1e293b;
      font-weight: 500;
    }

    .subtotal-text {
      font-size: 0.95rem;
      font-weight: 800;
      color: #059669;
    }

    .btn-delete-row {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      transition: color 0.2s ease;
    }

    .btn-delete-row:hover {
      color: #dc2626;
    }

    .btn-delete-row svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .btn-tambah-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      padding: 0.65rem 1.15rem;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 0.5rem;
    }

    .btn-tambah-item:hover {
      background-color: #f8fafc;
    }

    .btn-tambah-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.5;
    }

    .textarea-notes {
      width: 100%;
      padding: 0.85rem 1rem;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.925rem;
      color: #1e293b;
      resize: vertical;
      min-height: 90px;
      font-family: var(--font-family);
    }

    .action-footer-buttons {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 780px;
      margin: 2rem auto 0 auto;
      padding: 0 1.5rem;
      gap: 1.5rem;
    }

    .btn-batal-outline {
      flex: 1;
      padding: 0.9rem;
      background-color: #ffffff;
      border: 1.5px solid #dc2626;
      color: #dc2626;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .btn-batal-outline:hover {
      background-color: #fef2f2;
    }

    .btn-kirim-primary {
      flex: 1;
      padding: 0.9rem;
      background-color: var(--primary-navy);
      border: none;
      color: #ffffff;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease;
      box-shadow: 0 4px 12px rgba(21, 44, 78, 0.15);
    }

    .btn-kirim-primary:hover {
      background-color: var(--primary-navy-hover);
    }

    @media (max-width: 768px) {
      .table-headers-grid {
        display: none;
      }
      .item-row-grid {
        grid-template-columns: 1fr;
        background: #f8fafc;
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1rem;
      }
    }
  </style>
</head>
<body class="ajukan-body">

  <!-- Top Navbar -->
  <header class="detail-navbar">
    <a href="detail-produk.html" id="backLink" class="back-btn-circle" aria-label="Kembali">
      <svg class="back-arrow-icon" viewBox="0 0 24 24" fill="none">
        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1 class="detail-page-heading">Ajukan Permintaan</h1>
    <div class="navbar-actions">
      <button type="button" class="notification-bell-btn" aria-label="Notifikasi">
        <svg class="bell-icon" viewBox="0 0 24 24">
          <path d="M12 2a6 6 0 0 0-6 6v3.586l-.707.707A1 1 0 0 0 5 14h14a1 1 0 0 0 .707-1.707L18 11.586V8a6 6 0 0 0-6-6zM10 18a2 2 0 0 0 4 0h-4z"/>
        </svg>
        <span class="notification-badge-red">3</span>
      </button>
      <div class="user-profile-capsule">
        <div class="user-avatar-circle">AD</div>
        <span class="user-name-text">Buyer</span>
      </div>
    </div>
  </header>

  <!-- Form Container -->
  <div class="form-container-center">
    <div class="ajukan-card">
      <h2 class="ajukan-card-title">Ajukan Permintaan</h2>

      <form action="#" method="POST" id="ajukanForm">
        <!-- Perusahaan -->
        <div class="form-group" style="margin-bottom: 1.75rem;">
          <label class="field-label-sm">Perusahaan :</label>
          <input type="text" id="companyInput" class="input-readonly" value="PT Telur Makmur" readonly>
        </div>

        <div class="section-divider"></div>

        <!-- Item Pesanan -->
        <div class="item-pesanan-header">Item pesanan</div>

        <div class="table-headers-grid">
          <div>Produk *</div>
          <div>Qty/kg *</div>
          <div>Harga /kg *</div>
          <div>Subtotal</div>
          <div></div>
        </div>

        <div class="item-row-grid">
          <div class="select-wrapper">
            <select class="form-select" id="productSelect">
              <option value="Telur ayam">Telur ayam</option>
              <option value="Telur Omega">Telur Omega</option>
              <option value="Telur Ayam Kampung">Telur Ayam Kampung</option>
              <option value="Telur Ayam Ras Grade A">Telur Ayam Ras Grade A</option>
              <option value="Telur Ayam Ras Grade B">Telur Ayam Ras Grade B</option>
              <option value="Telur Ayam Ras Grade C">Telur Ayam Ras Grade C</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
          </div>
          <div>
            <input type="text" id="qtyInput" class="form-input-qty" value="2 kg">
          </div>
          <div>
            <input type="text" id="priceInput" class="form-input-price" value="Rp 250.000">
          </div>
          <div>
            <span id="subtotalText" class="subtotal-text">Rp 500.000</span>
          </div>
          <div>
            <button type="button" class="btn-delete-row" aria-label="Hapus item">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="button" class="btn-tambah-item">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tambah Item
        </button>

        <div class="section-divider"></div>

        <!-- Catatan Pesanan -->
        <div class="form-group" style="margin-bottom: 0;">
          <label class="field-label-sm">Catatan pesanan <span style="color: #94a3b8; font-weight: 400;">(opsional)</span></label>
          <textarea class="textarea-notes" placeholder="Tulis catatan pesanan di sini...">Mohon kemas setiap produk secara terpisah.</textarea>
        </div>
      </form>
    </div>
  </div>

  <!-- Action Footer Buttons -->
  <div class="action-footer-buttons">
    <a href="detail-produk.html" id="cancelLink" class="btn-batal-outline">Batal</a>
    <button type="button" id="kirimBtn" class="btn-kirim-primary">Kirim Permintaan</button>
  </div>

  <!-- Floating Navigation -->

  <script>
    // Handle seller and product parameters from detail page
    const urlParams = new URLSearchParams(window.location.search);
    const sellerId = urlParams.get('seller') || '1';
    const productName = urlParams.get('product');
    const productPrice = urlParams.get('price');

    const sellersMap = {
      '1': 'PT Telur Makmur',
      '2': 'Mitra Unggas Sejahtera',
      '3': 'Tunas Farm',
      '4': 'Berkah Telur Utama',
      '5': 'Ternak Mandiri',
      '6': 'Sinar Jaya Poultry'
    };

    // Tombol kembali & batal selalu mengarah ke halaman Detail Produk
    const backToProduct = `detail-produk.html?seller=${encodeURIComponent(sellerId)}` +
      `&product=${encodeURIComponent(productName || 'Telur ayam')}` +
      `&price=${encodeURIComponent(productPrice || 'Rp 250.000')}`;

    document.getElementById('backLink').href = backToProduct;
    document.getElementById('cancelLink').href = backToProduct;

    if (sellersMap[sellerId]) {
      document.getElementById('companyInput').value = sellersMap[sellerId];
    }

    if (productName) {
      const select = document.getElementById('productSelect');
      // check if option exists, otherwise add it
      let found = false;
      for (let opt of select.options) {
        if (opt.value === productName) {
          opt.selected = true;
          found = true;
          break;
        }
      }
      if (!found) {
        const newOpt = document.createElement('option');
        newOpt.value = productName;
        newOpt.text = productName;
        newOpt.selected = true;
        select.add(newOpt);
      }
    }

    if (productPrice) {
      document.getElementById('priceInput').value = productPrice;
    }

    // Format rupiah otomatis & hitung subtotal
    const qtyInput = document.getElementById('qtyInput');
    const priceInput = document.getElementById('priceInput');
    const subtotalText = document.getElementById('subtotalText');

    function parseNumber(str) {
      return parseInt(String(str).replace(/[^0-9]/g, '')) || 0;
    }

    function formatRupiah(num) {
      return 'Rp ' + num.toLocaleString('id-ID');
    }

    function recalcSubtotal() {
      const qty = parseNumber(qtyInput.value);
      const price = parseNumber(priceInput.value);
      subtotalText.innerText = formatRupiah(qty * price);
    }

    priceInput.addEventListener('input', function () {
      const num = parseNumber(this.value);
      this.value = num ? formatRupiah(num) : '';
      recalcSubtotal();
    });

    qtyInput.addEventListener('input', function () {
      const num = parseNumber(this.value);
      this.value = num ? num + ' kg' : '';
      recalcSubtotal();
    });

    // Hitung ulang saat halaman dimuat (harga bisa berubah dari parameter URL)
    recalcSubtotal();

    // Tambah Item baru
    let itemCounter = 1;
    document.querySelector('.btn-tambah-item').addEventListener('click', function () {
      itemCounter++;
      const row = document.createElement('div');
      row.className = 'item-row-grid';
      row.innerHTML = `
        <div class="select-wrapper">
          <select class="form-select">
            <option>Telur ayam</option>
            <option>Telur Omega</option>
            <option>Telur Ayam Kampung</option>
            <option>Telur Ayam Ras Grade A</option>
            <option>Telur Ayam Ras Grade B</option>
            <option>Telur Ayam Ras Grade C</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
        </div>
        <div><input type="text" class="form-input-qty" value="1 kg"></div>
        <div><input type="text" class="form-input-price" value="Rp 0"></div>
        <div><span class="subtotal-text">Rp 0</span></div>
        <div>
          <button type="button" class="btn-delete-row" aria-label="Hapus item">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </button>
        </div>`;
      this.parentNode.insertBefore(row, this);
      bindRowEvents(row);
    });

    // Ikon hapus pada baris pertama
    bindRowEvents(document.querySelector('.item-row-grid'));

    function bindRowEvents(row) {
      if (!row) return;
      const qty = row.querySelector('.form-input-qty');
      const price = row.querySelector('.form-input-price');
      const sub = row.querySelector('.subtotal-text');

      price.addEventListener('input', function () {
        const num = parseNumber(this.value);
        this.value = num ? formatRupiah(num) : '';
        sub.innerText = formatRupiah(parseNumber(qty.value) * num);
      });

      qty.addEventListener('input', function () {
        const num = parseNumber(this.value);
        this.value = num ? num + ' kg' : '';
        sub.innerText = formatRupiah(num * parseNumber(price.value));
      });

      row.querySelector('.btn-delete-row').addEventListener('click', function () {
        row.remove();
      });
    }

    // Kirim Permintaan -> halaman Status Pesanan (membawa data pesanan)
    document.getElementById('kirimBtn').addEventListener('click', function () {
      const rows = document.querySelectorAll('.item-row-grid');
      const firstRow = rows[0];
      const product = firstRow.querySelector('.form-select').value;
      const qty = firstRow.querySelector('.form-input-qty').value || '2 kg';
      const subtotalValue = firstRow.querySelector('.subtotal-text').innerText;

      window.location.href = 'status-pesanan.html' +
        '?seller=' + encodeURIComponent(sellerId) +
        '&product=' + encodeURIComponent(product) +
        '&price=' + encodeURIComponent(document.getElementById('priceInput').value) +
        '&qty=' + encodeURIComponent(qty.replace(/\s*kg/i, '').trim() + ' kg') +
        '&subtotal=' + encodeURIComponent(subtotalValue);
    });
  </script>
</body>
</html>
