  <!-- ===== Teks pada mark ===== -->
  <text x="32.5" y="59" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-weight="800" font-size="13.5" fill="#12315e">Staplr</text>

  <!-- ===== Titik kuning + nama ===== -->
  <circle cx="80" cy="41" r="6" fill="#f2c318"/>
  <text x="94" y="50" font-family="Arial, 'Segoe UI', sans-serif" font-weight="800" font-size="30" fill="#12315e">Staplr</text>
