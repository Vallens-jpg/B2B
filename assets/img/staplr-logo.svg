  <path d="M34.5 21.5 C37.5 16.5 41.5 13 45.5 10.5" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Botol biru -->
  <rect x="50" y="6" width="7.5" height="18" rx="3.2" fill="#173a7c"/>
  <rect x="51.2" y="2.5" width="5" height="4.5" rx="1.2" fill="#173a7c"/>
  <!-- Tepi keranjang (hijau) -->
  <rect x="8" y="23.2" width="49" height="6" rx="3" fill="#21a94e"/>
