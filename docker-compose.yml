services:
  web:
    build: .
    ports: ["8080:80"]
    volumes: ["./src:/var/www/html"]
    env_file: .env
    depends_on: [db]

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports: ["3307:3306"]
    volumes: [db_data:/var/lib/mysql]

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
    ports: ["8081:80"]
    depends_on: [db]

volumes:
  db_data:
