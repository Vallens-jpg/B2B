<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Dispute & Komplain - Staplr Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Design tokens — disamakan dengan branch perusahaan (dashboard.css :root) */
    :root {
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --color-navy: #122f51;
      --color-navy-dark: #0d223c;
      --color-yellow: #ffc700;
      --color-avatar-green: #155f50;
      --color-bg-main: #f8fafc;
      --color-card-bg: #ffffff;
      --color-border: #e8ecf2;
      --color-text-dark: #0f172a;
      --color-text-muted: #64748b;
      --sidebar-width: 215px;
      --radius-card: 16px;
      --radius-pill: 999px;
      --shadow-card: 0 2px 12px -2px rgba(18, 47, 81, 0.04);
    }

    /* ==========================================================
       STAPLR ADMIN - DAFTAR DISPUTE (PIXEL-PERFECT REPLICA)
       Reference: assets/tampilan admin/4. Daftar dispute.png
       ========================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f8fafc;
      color: #0f2a4a;
      overflow-x: hidden;
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      width: 215px;
      flex-shrink: 0;
      /* Exact 7-stop gradient matching Admin design */
      background: linear-gradient(180deg, #87ab95 0%, #afc5aa 30%, #ebedc8 55%, #d2dcba 75%, #82a78f 100%);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid rgba(0, 0, 0, 0.04);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 8px 18px;
      text-decoration: none;
      user-select: none;
    }

    .sidebar-brand-icon {
      height: 34px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
    }

    .sidebar-brand-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #122f51;
      letter-spacing: -0.02em;
    }

    .sidebar-brand-dot {
      color: #ffc700;
      font-size: 1.1rem;
      line-height: 1;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      color: #1a3327;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .menu-item .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-item .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      stroke: #ffc700;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .menu-item.active .icon svg {
      fill: rgba(255, 199, 0, 0.25);
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.28);
      color: #0d2218;
    }

    /* Active Dispute state: dark teal text, translucent pill, golden yellow icon */
    .menu-item.active {
      background: rgba(255, 255, 255, 0.52);
      color: #0b1f14;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* ============ MAIN LAYOUT ============ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ============ TOPBAR ============ */
    .topbar {
      background: #ffffff;
      padding: 18px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e8ecf2;
    }

    .topbar h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .admin-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14.5px;
      font-weight: 600;
      color: #0f2a4a;
    }

    .admin-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #155f50;
      flex-shrink: 0;
    }

    /* ============ CONTENT ============ */
    .content {
      padding: 24px 36px 36px;
      flex: 1;
    }

    .content-title {
      font-size: 20px;
      font-weight: 800;
      color: #0f2a4a;
      letter-spacing: -0.2px;
      margin-bottom: 22px;
    }

    /* ============ FILTER PILLS ============ */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-pill {
      height: 36px;
      padding: 0 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #0f2a4a;
      border: 1px solid #e8ecf2;
      transition: all 0.15s ease;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      outline: none;
    }

    .filter-pill:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .filter-pill.active {
      background: #0f2a4a;
      color: #ffffff;
      border-color: #0f2a4a;
    }

    .filter-pill.active:hover {
      background: #17385f;
    }

    /* ============ CARD TABLE ============ */
    .table-card {
      background: #ffffff;
      border: 1px solid #e8ecf2;
      border-radius: 16px;
      box-shadow: 0 2px 12px -2px rgba(18, 47, 81, 0.04);
      overflow: hidden;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    thead th {
      background: #f8fafc;
      padding: 15px 20px;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #edf1f6;
      transition: background-color 0.1s ease;
    }

    tbody tr:hover {
      background-color: #fbfcfe;
    }

    tbody td {
      padding: 16px 20px;
      font-size: 14px;
      color: #334155;
      vertical-align: middle;
      white-space: nowrap;
    }

    /* Column Specific Styles */
    .td-id {
      font-weight: 700;
      color: #0f2a4a;
      font-size: 13.5px;
    }

    .td-date {
      color: #475569;
      font-weight: 500;
    }

    .td-buyer {
      color: #334155;
      font-weight: 500;
    }

    .td-category {
      color: #334155;
      font-weight: 500;
    }

    .td-media {
      color: #334155;
      font-weight: 500;
    }

    /* Badges for Status / Decision */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      height: 26px;
      box-sizing: border-box;
    }

    .badge-dot {
      font-size: 9px;
      line-height: 1;
    }

    /* Pending Badge */
    .badge-pending {
      background: #fff4cc;
      color: #8a6400;
      border: 1px solid #fde68a;
    }

    /* Waiting Item Badge */
    .badge-waiting {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    /* Approved Badge */
    .badge-approved {
      background: #e3f6ec;
      color: #14803f;
      border: 1px solid #a7f3d0;
    }

    /* Rejected Badge */
    .badge-rejected {
      background: #fde8e8;
      color: #b42318;
      border: 1px solid #fecaca;
    }

    /* Action Detail Button */
    .btn-detail {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 35px;
      padding: 0 18px;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #0f2a4a;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-detail:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    /* Table Footer & Pagination */
    .card-footer {
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #edf1f6;
      background: #ffffff;
    }

    .footer-info {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .btn-pagination {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 20px;
      background: #ffffff;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #0f2a4a;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-pagination:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-pagination:active {
      transform: scale(0.98);
    }

    /* Toast Notification */
    .staplr-toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 14px 20px;
      border-radius: 10px;
      background: #0f2a4a;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(15, 42, 74, 0.2);
      z-index: 9999;
      transform: translateY(60px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .staplr-toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .staplr-toast.info {
      background: #0f2a4a;
      border: 1px solid #1e3a8a;
    }

    /* Empty state */
    .empty-row td {
      text-align: center;
      padding: 36px 20px;
      color: #64748b;
      font-size: 13.5px;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 820px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        padding: 20px;
      }
      .topbar {
        padding: 0 20px;
      }
      .content {
        padding: 20px;
      }
      .filter-row {
        gap: 8px;
      }
    }
  </style>
</head>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="main">
    <!-- Topbar -->
    <header class="topbar">
      <h1>Dispute</h1>
      <div class="admin-profile" id="adminProfileBtn" style="cursor: pointer;" title="Profil Admin">
        <div class="admin-avatar"></div>
        <span>Admin</span>
      </div>
    </header>

    <!-- Page Body -->
    <section class="content">
      <h2 class="content-title">Daftar Dispute & Komplain</h2>

      <!-- Filter Pills -->
      <div class="filter-row" id="filterPillsRow">
        <button type="button" class="filter-pill active" data-filter="all">Semua</button>
        <button type="button" class="filter-pill" data-filter="pending">
          Perlu Ditinjau (<span id="countPendingBadge">1</span>)
        </button>
        <button type="button" class="filter-pill" data-filter="waiting">Menunggu Barang</button>

      <div class="table-card">

              <tr>

                <th>PEMBELI</th>
                <th>KATEGORI KOMPLAIN</th>
                <th>BUKTI (MEDIA)</th>
                <th>KEPUTUSAN</th>
                <th>AKSI</th>
              </tr>
            </thead>
            <tbody id="disputeTableBody">
              <!-- Dynamically rendered rows -->
            </tbody>
          </table>
        </div>

        <!-- Footer Pagination Info -->
        <div class="card-footer">
          <span class="footer-info" id="footerInfoText">Menampilkan 1–3 dari 3 dispute</span>
          <button class="btn-pagination" id="btnNextPage" type="button">Selanjutnya</button>

  <!-- Toast Notification -->
  <div id="toastNotification" class="staplr-toast"></div>

  <!-- Client-side Logic Script -->
  <script>
    // ==========================================
    // STAPLR ADMIN - DISPUTE & COMPLAINTS LOGIC
    // ==========================================
    const STORAGE_KEY = 'staplr_dispute_list';

    // Default dispute records matching pixel-perfect design
    const initialDisputes = [
      {
        id: '#RET-2026-001',
        orderId: '#ORD-2026-089',
        date: '11 Okt 2026',
        buyDate: '05 Oktober 2026',
        buyer: 'Rira W. (PT Rira Pangan)',
        product: 'Telur Ayam (500 Kg)',
        category: 'Barang Rusak/Pecah',
        categoryFull: 'Barang Rusak / Cacat / Pecah',
        media: '2 Foto dan 1 Video',
        complaint: 'saya pesan 15 kg kok 14 kg rusak semua???',
        solution: 'Refund Rp 350.000',
        attachments: [
          { type: 'JPG', title: 'Foto 1 - Kerusakan Tray Telur', desc: 'Lampiran foto 1 dari pembeli' },
          { type: 'JPG', title: 'Foto 2 - Detail Pecahan Telur', desc: 'Lampiran foto 2 dari pembeli' },
          { type: 'MP4', title: 'Video 1 - Pemeriksaan Kerusakan', desc: 'Lampiran video 1 dari pembeli' }
        ],
        status: 'pending', // pending, waiting, approved, rejected
        statusLabel: 'Pending'
      },
      {
        id: '#RET-2026-002',
        orderId: '#ORD-2026-074',
        date: '09 Okt 2026',
        buyDate: '03 Oktober 2026',
        buyer: 'PT Boga Jaya',
        product: 'Minyak Goreng (200 L)',
        category: 'Kuantitas Kurang',
        categoryFull: 'Kuantitas Kurang / Tidak Lengkap',
        media: '1 Foto',
        complaint: 'Pesanan kurang 1 jerigen saat pengiriman.',
        solution: 'Pengiriman Susulan / Refund Sebagian',
        attachments: [
          { type: 'JPG', title: 'Foto 1 - Kekurangan Jerigen Minyak', desc: 'Lampiran foto dari pembeli' }
        ],
        status: 'approved',
        statusLabel: 'Disetujui'
      },
      {
        id: '#RET-2026-003',
        orderId: '#ORD-2026-061',
        date: '05 Okt 2026',
        buyDate: '01 Oktober 2026',
        buyer: 'CV Sembako',
        product: 'Beras Premium (100 Karung)',
        category: 'Tidak Sesuai Specs',
        categoryFull: 'Barang Tidak Sesuai Spesifikasi',
        media: '3 Foto',
        complaint: 'Kualitas beras tidak sesuai dengan deskripsi pesanan.',
        solution: 'Tolak klaim karena sudah lewat batas waktu verifikasi.',
        attachments: [
          { type: 'JPG', title: 'Foto 1 - Timbangan Beras', desc: 'Lampiran foto timbangan' },
          { type: 'JPG', title: 'Foto 2 - Kualitas Butir Beras', desc: 'Lampiran foto butiran beras' },
          { type: 'JPG', title: 'Foto 3 - Label Karung Beras', desc: 'Lampiran foto kemasan karung' }
        ],
        status: 'rejected',
        statusLabel: 'Ditolak'
      }
    ];

    function getDisputes() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          let parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(d => {
              const match = initialDisputes.find(init => init.id === d.id);
              return match ? { ...match, ...d } : d;
            });
          }
        } catch (e) {
          console.error(e);
        }
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(initialDisputes));
      return initialDisputes;
    }

    function saveDisputes(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      toast.className = 'staplr-toast info show';
      toast.textContent = message;
      setTimeout(() => {
        toast.className = 'staplr-toast';
      }, 2500);
    }

    let activeFilter = 'all';

    function renderDisputes() {
      const disputes = getDisputes();

      // Update badge count for Perlu Ditinjau (pending items)
      const pendingCount = disputes.filter(d => d.status === 'pending').length;
      document.getElementById('countPendingBadge').textContent = pendingCount;

      // Filter disputes based on active tab
      const filtered = disputes.filter(d => {
        if (activeFilter === 'all') return true;
        return d.status === activeFilter;
      });

      // Update footer pagination text
      const total = disputes.length;
      const footerInfo = document.getElementById('footerInfoText');
      if (filtered.length === total) {
        footerInfo.textContent = `Menampilkan 1–${filtered.length} dari ${total} dispute`;
      } else if (filtered.length > 0) {
        footerInfo.textContent = `Menampilkan ${filtered.length} dari ${filtered.length} dispute`;
      } else {
        footerInfo.textContent = `Menampilkan 0 dispute`;
      }

      // Render Table Rows
      const tbody = document.getElementById('disputeTableBody');
      tbody.innerHTML = '';

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr class="empty-row">
            <td colspan="7">Tidak ada dispute dalam kategori ini.</td>
          </tr>
        `;
        return;
      }

      filtered.forEach(d => {
        const tr = document.createElement('tr');

        // Determine badge styling
        let badgeHtml = '';
        if (d.status === 'pending') {
          badgeHtml = `
            <span class="badge badge-pending">
              <span class="badge-dot">●</span> Pending
            </span>
          `;
        } else if (d.status === 'approved') {
          badgeHtml = `
            <span class="badge badge-approved">
              <span class="badge-dot">●</span> Disetujui
            </span>
          `;
        } else if (d.status === 'rejected') {
          badgeHtml = `
            <span class="badge badge-rejected">
              <span class="badge-dot">●</span> Ditolak
            </span>
          `;
        } else if (d.status === 'waiting') {
          badgeHtml = `
            <span class="badge badge-waiting">
              <span class="badge-dot">●</span> Menunggu Barang
            </span>
          `;
        }

        tr.innerHTML = `
          <td class="td-id">${d.id}</td>
          <td class="td-date">${d.date}</td>
          <td class="td-buyer">${d.buyer}</td>
          <td class="td-category">${d.category}</td>
          <td class="td-media">${d.media}</td>
          <td>${badgeHtml}</td>
          <td>
            <a href="detail-dispute.html?id=${encodeURIComponent(d.id)}" class="btn-detail" onclick="handleDetailClick('${d.id}')">Detail</a>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    // Save selected dispute before navigation
    window.handleDetailClick = function(id) {
      localStorage.setItem('staplr_selected_dispute_id', id);
    };

    document.addEventListener('DOMContentLoaded', () => {
      // 1. Filter pill click events
      const pills = document.querySelectorAll('.filter-pill');
      pills.forEach(pill => {
        pill.addEventListener('click', () => {
          pills.forEach(p => p.classList.remove('active'));
          pill.classList.add('active');

          activeFilter = pill.getAttribute('data-filter');
          renderDisputes();
        });
      });

      // 2. Next Page button event
      const btnNext = document.getElementById('btnNextPage');
      btnNext.addEventListener('click', () => {
        showToast('Anda berada pada halaman 1 dari 1 (Semua dispute ditampilkan)');
      });

      // 3. Topbar Profile button event
      const adminProfileBtn = document.getElementById('adminProfileBtn');
      if (adminProfileBtn) {
        adminProfileBtn.addEventListener('click', () => {
          showToast('Masuk sebagai Administrator Staplr (Superadmin)');
        });
      }

      // Initial render
      renderDisputes();
    });
  </script>
</body>
</html>
