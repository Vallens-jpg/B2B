<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Staplr Admin</title>
  <style>
    /* ==========================================================
       STAPLR ADMIN - DASHBOARD (PIXEL-PERFECT REPLICA)
       Reference: media_1793680693993_c2b7f3e8.png
       ========================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background: #f4f7fa;
      color: #0f2a4a;
      overflow-x: hidden;
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: linear-gradient(
        180deg,
        #87ab95 0%,
        #8fad97 20%,
        #b9ccaf 40%,
        #ebedc9 60%,
        #cdd8b8 75%,
        #95b499 90%,
        #7ea58d 100%
      );
      padding: 32px 16px 24px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid rgba(15, 42, 74, 0.06);
    }

    .logo-container {
      display: flex;
      align-items: center;
      padding: 0 10px 42px 10px;
    }

    .logo-container a {
      display: inline-block;
      text-decoration: none;
    }

    .logo-container img {
      height: 56px;
      width: auto;
      max-width: 100%;
      display: block;
      object-fit: contain;
      cursor: pointer;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .menu-item .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-item .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .menu-item.active {
      background: rgba(255, 255, 255, 0.22);
      color: #092d40;
      font-weight: 700;
    }

    /* ============ MAIN LAYOUT ============ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* ============ TOPBAR ============ */
    .topbar {
      height: 80px;
      background: #ffffff;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf1f5;
    }

    .topbar h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f2a4a;
      letter-spacing: -0.3px;
    }

    .admin-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14.5px;
      font-weight: 600;
      color: #0f2a4a;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 20px;
      transition: background 0.15s ease;
    }

    .admin-profile:hover {
      background: #f1f5f9;
    }

    .admin-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #166951 0%, #0d4635 100%);
      flex-shrink: 0;
    }

    /* ============ CONTENT ============ */
    .content {
      padding: 32px 36px;
      flex: 1;
    }

    /* ============ 4 STAT CARDS ============ */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px 24px;
      box-shadow: 0 1px 3px rgba(15, 42, 74, 0.03);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .stat-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 12px rgba(15, 42, 74, 0.08);
      transform: translateY(-2px);
    }

    .stat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .stat-label {
      font-size: 14px;
      color: #64748b;
      font-weight: 500;
    }

    .stat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon svg {
      width: 19px;
      height: 19px;
    }

    .stat-icon.blue   { background: #eff6ff; }
    .stat-icon.amber  { background: #fef3c7; }
    .stat-icon.red    { background: #fee2e2; }
    .stat-icon.emerald{ background: #ecfdf5; }

    .stat-value {
      font-size: 30px;
      font-weight: 800;
      color: #0f2a4a;
      letter-spacing: -0.5px;
      margin-bottom: 0;
      line-height: 1.15;
    }

    /* ============ STATISTIK TRANSAKSI BULANAN (CHART) ============ */
    .chart-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px 26px 26px;
      box-shadow: 0 1px 3px rgba(15, 42, 74, 0.03);
    }

    .chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .chart-head h2 {
      font-size: 18px;
      font-weight: 800;
      color: #0f2a4a;
      letter-spacing: -0.2px;
      margin-bottom: 0;
    }

    .btn-period {
      background: #0f2a4a;
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-period:hover {
      background: #17385f;
    }

    /* Outer chart plot area container */
    .chart-plot {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px 12px 14px 12px;
    }

    .chart-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Month labels outside & below the chart-plot container */
    .chart-x-row {
      position: relative;
      height: 24px;
      margin-top: 18px;
    }

    .chart-x-row span {
      position: absolute;
      transform: translateX(-50%);
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      text-align: center;
    }

    /* ============ TOAST NOTIFICATION ============ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      min-width: 300px;
      max-width: 420px;
      background: #0f2a4a;
      color: #ffffff;
      border-radius: 10px;
      padding: 12px 18px;
      box-shadow: 0 10px 25px -5px rgba(15, 42, 74, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideToastIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      transition: opacity 0.25s, transform 0.25s;
    }

    .toast.toast-leave {
      opacity: 0;
      transform: translateX(30px);
    }

    @keyframes slideToastIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toast-icon svg {
      width: 100%;
      height: 100%;
    }

    .toast-message {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.4;
      flex: 1;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 1200px) {
      .stat-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 820px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        padding: 20px;
      }
      .topbar {
        padding: 0 20px;
      }
      .content {
        padding: 20px;
      }
      .stat-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

  <!-- ==================== JAVASCRIPT ==================== -->
  <script>
    (function() {
      const toastContainer = document.getElementById('toastContainer');

      function showToast(message, type) {
        type = type || 'info';
        const toast = document.createElement('div');
        toast.className = 'toast';
        let iconSvg = '';
        if (type === 'success') {
          iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
        } else if (type === 'warning') {
          iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
        } else {
          iconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
        }
        toast.innerHTML = '<div class="toast-icon">' + iconSvg + '</div><div class="toast-message">' + message + '</div>';
        toastContainer.appendChild(toast);
        setTimeout(function() {
          toast.classList.add('toast-leave');
          setTimeout(function() {
            if (toast.parentNode) toast.parentNode.removeChild(toast);
          }, 250);
        }, 3200);
      }

      // Stat card clicks
      document.getElementById('cardTotalUser').addEventListener('click', function() {
